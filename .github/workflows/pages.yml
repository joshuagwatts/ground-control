name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          if [ -n "${{ secrets.TEAM_SWDI_PROXY_URL }}" ]; then
            echo "export const TEAM_SWDI_PROXY = \"${{ secrets.TEAM_SWDI_PROXY_URL }}\";" > www/proxy-config.js
          fi
          mkdir -p _site
          cp -a www/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
